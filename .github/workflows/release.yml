name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.10.0

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Update npm for trusted publishing
        run: npm install -g npm@latest

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check source
        run: pnpm check

      - name: Validate release version
        id: version
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          tag_version="${TAG_NAME#v}"
          package_version="$(node -p "require('./package.json').version")"
          if [[ "${TAG_NAME}" != "v${package_version}" ]]; then
            echo "Tag ${TAG_NAME} must match package.json version ${package_version}" >&2
            exit 1
          fi
          echo "value=${tag_version}" >>"${GITHUB_OUTPUT}"

      - name: Publish to npm
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          if npm view "ask-hermes-mcp@${VERSION}" version >/dev/null 2>&1; then
            echo "ask-hermes-mcp@${VERSION} already on the registry, skipping publish"
          else
            npm publish
          fi

      - name: Build RPM
        run: ./scripts/build-rpm.sh "${{ steps.version.outputs.value }}"

      - name: Verify RPM and write checksum
        run: |
          package="rpm-dist/ask-hermes-mcp-${{ steps.version.outputs.value }}-1.noarch.rpm"
          test -s "${package}"
          file "${package}" | grep --quiet "RPM"
          sha256sum "${package}" >rpm-dist/SHA256SUMS

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: ask-hermes-mcp-${{ steps.version.outputs.value }}-rpm
          path: rpm-dist/
          if-no-files-found: error

      - name: Create GitHub release and upload RPM
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          if ! gh release view "${TAG_NAME}" >/dev/null 2>&1; then
            gh release create "${TAG_NAME}" --verify-tag --generate-notes
          fi
          gh release upload "${TAG_NAME}" rpm-dist/* --clobber
